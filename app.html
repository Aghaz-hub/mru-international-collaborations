<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MRU International Collaborations | Manav Rachna</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fc;color:#14213d;font:14px/1.4 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{height:64px;background:#fff;border-bottom:1px solid #e3e9f3;display:flex;align-items:center;gap:20px;padding:0 20px;position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;width:auto;flex:none}.logo img{height:54px;width:auto;display:block}.logo b{display:block;font-size:17px}.logo small{color:#5b6781;font-size:11.5px}
.sb{flex:0 1 420px;display:flex;align-items:center;gap:10px;border:1px solid #cfd8e6;border-radius:10px;padding:9px 14px;background:#fff;color:#5b6781}
.sb input{border:0;outline:0;flex:1;font:inherit;background:none}.sp{flex:1}
.ib{position:relative;color:#333;display:flex}.ib em{position:absolute;top:-7px;right:-8px;background:#1a64d8;color:#fff;font:600 10px/1 sans-serif;border-radius:9px;padding:3px 5px}
.ad{display:flex;align-items:center;gap:10px}.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#1a64d8,#7aa9f5);color:#fff;display:grid;place-items:center;font-weight:700}.ad b{display:block}.ad small{color:#5b6781;font-size:12px}
.wrap{display:flex;align-items:flex-start}
aside{width:176px;flex:none;background:#fff;border-right:1px solid #e3e9f3;min-height:calc(100vh - 64px);padding:14px 8px;position:sticky;top:64px}
aside button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:9px;margin-bottom:6px;font-size:15px;line-height:1.2}
aside button:hover{background:#eef3fb}aside button.on{background:#1a64d8;color:#fff;font-weight:600}
main{flex:1;min-width:0;padding:22px 18px 40px}.cols{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px}
h1{margin:0;font-size:28px}.sub{color:#5b6781;margin:2px 0 14px;font-size:14.5px}h3{margin:18px 0 10px;font-size:18px}
.card{background:#fff;border:1px solid #e3e9f3;border-radius:12px;padding:14px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.kpi{display:flex;gap:10px;align-items:center;padding:14px 12px;transition:.15s}.kpi:hover{border-color:#1a64d8;box-shadow:0 3px 12px #1a64d822;transform:translateY(-1px)}
.kpi small{display:block;font-size:11.5px;color:#333;font-weight:600}.kpi b{font-size:28px;line-height:1.1}.kpi b.t{font-size:19px;color:#1a64d8}
.tiles{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.tile{cursor:pointer;text-align:center;padding:14px 4px;font-size:13px;font-weight:500;transition:.15s}.tile:hover{border-color:#1a64d8;box-shadow:0 3px 10px #1a64d822}
.ci{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;margin:0 auto 8px}.ci svg{width:26px;height:26px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.card h4{margin:0;font-size:16px}.card p{margin:2px 0 6px;color:#5b6781;font-size:12.5px}
.leg{display:flex;gap:16px;font-size:12px;margin-top:6px}.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.rh a{color:#1a64d8;font-size:13px;display:flex;align-items:center;gap:2px;cursor:pointer}.rh a svg{width:15px;height:15px}
.rm{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #edf1f7}.rm:first-of-type{border-top:0}.fl{font-size:24px;width:32px;text-align:center}.rm div{flex:1;min-width:0;font-size:13px}.rm small{display:block;color:#5b6781}.rm span{color:#1a64d8;font-size:13px;white-space:nowrap}
select{width:100%;padding:8px;border:1px solid #cfd8e6;border-radius:8px;font:inherit;background:#fff}.sch{font-size:12.5px;margin-top:8px;line-height:1.75}
.al{display:flex;gap:8px;align-items:flex-start;padding:8px 0;font-size:13px}.al small{display:block;color:#5b6781}.right .card{margin-bottom:14px}
.tw{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}th{text-align:left;color:#5b6781;font-size:12.5px;padding:9px 10px;border-bottom:1px solid #e3e9f3}td{padding:9px 10px;border-bottom:1px solid #edf1f7;vertical-align:top}td small{display:block;color:#5b6781}
.tl{display:flex;gap:10px;margin-bottom:12px}.tl input{flex:1;padding:9px 12px;border:1px solid #cfd8e6;border-radius:8px;font:inherit}
@media(max-width:1180px){.cols{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(4,1fr)}.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.wrap{flex-direction:column}aside{width:100%;min-height:0;display:flex;overflow:auto;position:static}aside button{width:auto;white-space:nowrap}.two{grid-template-columns:1fr}.sb,.ad div,.logo{width:auto}.kpis{grid-template-columns:repeat(2,1fr)}}

.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:600}
.badge.green{background:#dcfce7;color:#166534}.badge.amber{background:#fef3c7;color:#92400e}.badge.blue{background:#dbeafe;color:#1e40af}.badge.gray{background:#f3f4f6;color:#374151}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:12px}
.kcol{background:#f8fafc;border-radius:10px;padding:10px;min-height:320px}
.kcol h4{margin:0 0 10px;font-size:14px;display:flex;justify-content:space-between}
.kcard{background:#fff;border:1px solid #e3e9f3;border-radius:8px;padding:10px;margin-bottom:8px;font-size:13px;box-shadow:0 1px 2px #0001}
.kcard b{display:block;margin-bottom:4px}.kcard small{color:#5b6781}
</style></head><body>
