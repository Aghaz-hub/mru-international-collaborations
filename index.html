<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Manav Rachna University – International Collaborations</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      background: linear-gradient(135deg, #e8f0fe 0%, #f0f4f8 50%, #e3eefb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #14213d;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(26, 100, 216, 0.12);
      width: 100%;
      max-width: 420px;
      padding: 40px 36px;
      border: 1px solid #e3e9f3;
    }
    .logo-area {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo-area .icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, #1a64d8, #4a8df0);
      border-radius: 16px;
      display: grid;
      place-items: center;
      margin: 0 auto 14px;
      color: #fff;
      font-size: 28px;
      font-weight: 700;
    }
    .logo-area h1 {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 4px;
    }
    .logo-area p {
      font-size: 13px;
      color: #5b6781;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cfd8e6;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .form-group input:focus {
      border-color: #1a64d8;
      box-shadow: 0 0 0 3px rgba(26, 100, 216, 0.15);
    }
    .btn {
      width: 100%;
      padding: 13px;
      background: #1a64d8;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      margin-top: 8px;
    }
    .btn:hover { background: #1554b8; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .error.show { display: block; }
    .hint {
      margin-top: 22px;
      text-align: center;
      font-size: 12px;
      color: #5b6781;
      line-height: 1.5;
    }
    .hint code {
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
    }
    .footer {
      text-align: center;
      margin-top: 24px;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>

    <div class="error" id="error">Invalid username or password</div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="loginBtn">Sign In</button>
    </form>

    <div class="hint">
      Default Admin Credentials<br>
      Username: <code>admin</code><br>
      Password: <code>mru@oiac2026</code>
    </div>

    <div class="footer">
      © 2026 Manav Rachna University | International Collaborations Tracker
    </div>
  </div>

  <script>
    // ====================== AUTH CONFIG ======================
    // Change these credentials as needed
    const ADMIN_USER = "admin";
    const ADMIN_PASS = "mru@oiac2026";
    // ========================================================

    // If already logged in, go to app
    if (localStorage.getItem("mru_auth") === "true") {
      window.location.href = "app.html";
    }

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const user = document.getElementById("username").value.trim();
      const pass = document.getElementById("password").value;
      const errorEl = document.getElementById("error");
      const btn = document.getElementById("loginBtn");

      btn.disabled = true;
      btn.textContent = "Signing in...";

      setTimeout(() => {
        if (user === ADMIN_USER && pass === ADMIN_PASS) {
          localStorage.setItem("mru_auth", "true");
          localStorage.setItem("mru_user", user);
          localStorage.setItem("mru_login_time", new Date().toISOString());
          window.location.href = "app.html";
        } else {
          errorEl.classList.add("show");
          btn.disabled = false;
          btn.textContent = "Sign In";
        }
      }, 400);
    });
  </script>
